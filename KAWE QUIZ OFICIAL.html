<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Kawe Quiz</title>

<style>

body{
background:#000;
color:#00ff88;
font-family:Arial;
text-align:center;
margin:0;
}

h1{
color:#00ff88;
}

.menu{
margin-top:100px;
}

button{
background:#001a0f;
border:2px solid #00ff88;
color:#00ff88;
padding:12px 20px;
margin:10px;
font-size:16px;
cursor:pointer;
border-radius:6px;
}

button:hover{
background:#00ff88;
color:#000;
}

.tela{
display:none;
padding:20px;
}

#quizBox{
margin-top:40px;
}

.opcao{
display:block;
margin:10px auto;
width:200px;
}

#placar{
font-size:20px;
margin-top:20px;
}

</style>
</head>

<body>

<!-- MENU -->
<div id="menu" class="menu">
<h1>🟢 KAWE QUIZ 🟢</h1>

<button onclick="abrirQuiz()">Iniciar Quiz</button>
<button onclick="abrirConfig()">Configurações</button>
<button onclick="abrirSobre()">Sobre</button>
</div>

<!-- QUIZ -->
<div id="quiz" class="tela">

<h1>Perguntas Gerais</h1>

<div id="quizBox">

<p id="pergunta"></p>

<button class="opcao" onclick="responder(0)" id="op0"></button>
<button class="opcao" onclick="responder(1)" id="op1"></button>
<button class="opcao" onclick="responder(2)" id="op2"></button>
<button class="opcao" onclick="responder(3)" id="op3"></button>

</div>

<p id="placar"></p>

<button onclick="voltarMenu()">Voltar</button>

</div>

<!-- CONFIGURAÇÕES -->
<div id="config" class="tela">

<h1>Configurações</h1>

<p>Som do jogo</p>
<button onclick="alert('Som ativado')">Ativar</button>
<button onclick="alert('Som desativado')">Desativar</button>

<p>Dificuldade</p>
<button onclick="alert('Fácil')">Fácil</button>
<button onclick="alert('Médio')">Médio</button>
<button onclick="alert('Difícil')">Difícil</button>

<br><br>

<button onclick="voltarMenu()">Voltar</button>

</div>

<!-- SOBRE -->
<div id="sobre" class="tela">

<h1>Sobre</h1>

<p>Plataforma de perguntas criada por Kawe.</p>
<p>Tema verde e preto estilo gamer.</p>

<button onclick="voltarMenu()">Voltar</button>

</div>

<script>

let perguntas = [
{
p:"Qual é o maior planeta do sistema solar?",
op:["Terra","Júpiter","Marte","Saturno"],
r:1
},

{
p:"Quem descobriu o Brasil?",
op:["Pedro Álvares Cabral","Cristóvão Colombo","Dom Pedro","Tiradentes"],
r:0
},

{
p:"Quanto é 5 x 6?",
op:["11","20","30","35"],
r:2
},

{
p:"Qual linguagem cria sites?",
op:["Python","HTML","Java","C++"],
r:1
}

]

let atual = 0
let pontos = 0

function abrirQuiz(){

document.getElementById("menu").style.display="none"
document.getElementById("quiz").style.display="block"

atual = 0
pontos = 0

carregarPergunta()

}

function abrirConfig(){

document.getElementById("menu").style.display="none"
document.getElementById("config").style.display="block"

}

function abrirSobre(){

document.getElementById("menu").style.display="none"
document.getElementById("sobre").style.display="block"

}

function voltarMenu(){

document.getElementById("menu").style.display="block"
document.getElementById("quiz").style.display="none"
document.getElementById("config").style.display="none"
document.getElementById("sobre").style.display="none"

}

function carregarPergunta(){

let q = perguntas[atual]

document.getElementById("pergunta").innerText = q.p

document.getElementById("op0").innerText = q.op[0]
document.getElementById("op1").innerText = q.op[1]
document.getElementById("op2").innerText = q.op[2]
document.getElementById("op3").innerText = q.op[3]

}

function responder(op){

if(op == perguntas[atual].r){
pontos++
}

atual++

if(atual < perguntas.length){

carregarPergunta()

}else{

document.getElementById("quizBox").innerHTML = "<h2>Quiz terminado!</h2>"
document.getElementById("placar").innerText = "Pontuação: "+pontos+" / "+perguntas.length

}

}

</script>

</body>
</html>
